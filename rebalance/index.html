<!doctype html>
<html lang="zh-TW" class="no-js" data-title-key="rebalance.title" data-desc-key="rebalance.desc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>再平衡：不賣出也能修正的做法 | 帳線</title>
<meta name="description" content="別的工具只會叫你賣。這個先算出光靠新資金能修正到什麼程度，再告訴你賣出實際要付多少稅費。">
<meta name="color-scheme" content="dark light">
<meta property="og:title" content="Rebalance | Ledgerline">
<meta property="og:description" content="Cash-only rebalancing, drift tolerance, and the real cost of a sell order.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/ui.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<a class="skip-link" href="#stage" data-i18n="skip.results">跳到結果</a>
<header class="nav"></header>

<div class="shell">
<div class="workbench">

  <aside class="rail"><div id="profileLink"></div>

    <div class="group">
      <div class="group__head">
        <h2 class="group__title" data-i18n="rebalance.gHoldings">持有部位</h2>
        <span class="group__aside" id="targetSum">100%</span>
      </div>
      <div class="holding-head" aria-hidden="true">
        <span></span><span>Name</span><span>Value</span><span>Target</span><span></span>
      </div>
      <div class="holdings" id="holdings"></div>
      <div class="btn-row" style="margin-top:var(--s3)">
        <button class="btn btn--quiet" id="btnAdd" type="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>
          Add holding
        </button>
        <button class="btn btn--quiet" id="btnNormalise" type="button">Make targets 100%</button>
      </div>
      <div class="presets" style="margin-top:var(--s4)" id="presets" role="group" aria-label="Starting portfolios">
        <button class="preset" type="button" data-preset="classic" aria-pressed="true">60 / 40</button>
        <button class="preset" type="button" data-preset="threefund">Three fund</button>
        <button class="preset" type="button" data-preset="permanent">Permanent</button>
      </div>
    </div>

    <div class="group">
      <div class="group__head"><h2 class="group__title" data-i18n="rebalance.gThis">這次再平衡</h2></div>

      <div class="field">
        <label class="field__label" for="newCash"><span data-i18n="rebalance.newCash">這次要投入的新資金</span>
          <span class="field__hint"></span></label>
        <div class="input-wrap" data-num="newCash">
          <span class="input-wrap__prefix" data-cur-symbol>NT$</span>
          <input class="input" id="newCash" type="number" inputmode="numeric" value="0" min="0" step="10000">
          <span class="stepper">
            <button type="button" data-dir="1" aria-label="Increase new money"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6.5 5 3.5l3 3"/></svg></button>
            <button type="button" data-dir="-1" aria-label="Decrease new money"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.5 5 6.5l3-3"/></svg></button>
          </span>
        </div>
      </div>

      <div class="field">
        <span class="field__label" id="modeLabel">Method</span>
        <div class="seg" id="modeSeg" role="group" aria-labelledby="modeLabel">
          <button type="button" data-mode="buy" aria-pressed="true">Buy only</button>
          <button type="button" data-mode="both" aria-pressed="false">Buy and sell</button>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="tol"><span data-i18n="rebalance.tol">你能接受的偏離</span>
          <span class="field__hint"></span></label>
        <div class="range-row">
          <input class="range" id="tol" type="range" min="0" max="15" step="0.5" value="5">
          <output class="range-val" for="tol" id="tolOut">5.0</output>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group__head">
        <h2 class="group__title" data-i18n="rebalance.gFriction">摩擦成本</h2>
        <span class="group__aside">why selling hurts</span>
      </div>

      <div class="field">
        <label class="field__label" for="cost"><span data-i18n="rebalance.cost">單邊交易成本</span></label>
        <div class="range-row">
          <input class="range" id="cost" type="range" min="0" max="1" step="0.005" value="0.1425">
          <output class="range-val" for="cost" id="costOut">0.143%</output>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="tax"><span data-i18n="rebalance.tax">已實現獲利的稅率</span></label>
        <div class="range-row">
          <input class="range" id="tax" type="range" min="0" max="45" step="1" value="0">
          <output class="range-val" for="tax" id="taxOut">0%</output>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="gain"><span data-i18n="rebalance.gain">持股平均未實現獲利</span>
          <span class="field__hint"></span></label>
        <div class="range-row">
          <input class="range" id="gain" type="range" min="0" max="200" step="5" value="30">
          <output class="range-val" for="gain" id="gainOut">30%</output>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group__head"><h2 class="group__title" data-i18n="common.currency">幣別</h2></div>
      <div class="seg" id="curSeg" role="group" data-i18n-attr="aria-label:common.currency">
        <button type="button" data-cur="TWD" aria-pressed="true">TWD</button>
        <button type="button" data-cur="USD" aria-pressed="false">USD</button>
        <button type="button" data-cur="EUR" aria-pressed="false">EUR</button>
        <button type="button" data-cur="JPY" aria-pressed="false">JPY</button>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn--ghost" id="btnShare" type="button"><span data-i18n="common.copyLink">複製連結</span></button>
      <button class="btn btn--quiet" id="btnReset" type="button" data-i18n="common.reset">重設</button>
    </div>
  </aside>

  <main class="stage" id="stage">

    <div class="stage__head">
      <div>
        <h1 class="stage__title" data-i18n="rebalance.h1">再平衡</h1>
        <p class="stage__sub" data-i18n="rebalance.sub">賣出是回到目標最貴的一條路。先看看新的錢自己能修到什麼程度。</p>
      </div>
    </div>

    <div class="metrics" id="metrics">
      <div class="metric" id="mTotal">
        <div class="metric__label" data-i18n="rebalance.mTotal">總資產</div>
        <div class="metric__value num" id="vTotal">-</div>
        <div class="metric__foot" id="fTotal">&nbsp;</div>
      </div>
      <div class="metric" id="mDrift">
        <div class="metric__label" data-i18n="rebalance.mDrift">最大偏離</div>
        <div class="metric__value num" id="vDrift">-</div>
        <div class="metric__foot" id="fDrift">&nbsp;</div>
      </div>
      <div class="metric" id="mCash">
        <div class="metric__label" data-i18n="rebalance.mCash">不賣出所需的新資金</div>
        <div class="metric__value metric__value--accent num" id="vCash">-</div>
        <div class="metric__foot" id="fCash">&nbsp;</div>
      </div>
      <div class="metric" id="mCost">
        <div class="metric__label" data-i18n="rebalance.mCost">這次再平衡的成本</div>
        <div class="metric__value metric__value--neg num" id="vCost">-</div>
        <div class="metric__foot" id="fCost">&nbsp;</div>
      </div>
    </div>

    <div class="split split--wide-right" style="margin-top:var(--s5)">
      <section class="panel" aria-labelledby="mixTitle">
        <div class="panel__head"><h2 class="panel__title" id="mixTitle" data-i18n="rebalance.mixTitle">現況與目標</h2></div>
        <div class="panel__body">
          <div id="donutNow"></div>
          <div style="margin-top:var(--s5)" id="allocList"></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="driftTitle">
        <div class="panel__head">
          <h2 class="panel__title" id="driftTitle" data-i18n="rebalance.driftTitle">偏離程度與你的容忍範圍</h2>
          <span class="group__aside" id="driftLegend">band shows tolerance</span>
        </div>
        <div class="panel__body" id="driftList"></div>
      </section>
    </div>

    <section class="panel" style="margin-top:var(--s5)" data-reveal aria-labelledby="ordersTitle">
      <div class="panel__head">
        <h2 class="panel__title" id="ordersTitle" data-i18n="rebalance.ordersTitle">該下的單</h2>
        <button class="btn btn--quiet" id="btnCopyOrders" type="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-2a1.5 1.5 0 0 0-1.5-1.5H4a1.5 1.5 0 0 0-1.5 1.5V9A1.5 1.5 0 0 0 4 10.5h1.5"/></svg>
          Copy order list
        </button>
      </div>
      <div class="panel__body panel__body--flush" id="orders"></div>
    </section>

    <section class="panel" style="margin-top:var(--s5)" data-reveal aria-labelledby="cmpTitle">
      <div class="panel__head"><h2 class="panel__title" id="cmpTitle" data-i18n="rebalance.cmpTitle">只買不賣，對上有買有賣</h2></div>
      <div class="panel__body">
        <p class="fee-claim" id="cmpClaim">-</p>
        <p class="fee-sub" id="cmpSub">&nbsp;</p>
        <div class="fee-bars" id="cmpBars"></div>
      </div>
    </section>

    <p class="disclosure" style="margin-top:var(--s5)" data-i18n="rebalance.disclosure"></p>
  </main>

</div>
</div>

<footer class="site-foot"></footer>
<script type="module" src="./app.js"></script>
</body>
</html>
