<!doctype html>
<html lang="zh-TW" class="no-js" data-title-key="dividend.title" data-desc-key="dividend.desc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配息：什麼時候會入帳，入多少 | 帳線</title>
<meta name="description" content="殖利率是用年算的，帳單卻是每個月來。這裡把配息攤成月曆，扣完稅，並算出什麼時候能蓋過你的生活費。">
<meta name="color-scheme" content="dark light">
<meta property="og:title" content="Dividend | Ledgerline">
<meta property="og:description" content="A dividend calendar, growth on cost, and the month your income covers your bills.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/ui.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<a class="skip-link" href="#stage" data-i18n="skip.results">跳到結果</a>
<header class="nav"></header>

<div class="shell">
<div class="workbench">

  <aside class="rail"><div id="profileLink"></div>

    <div class="group">
      <div class="group__head">
        <h2 class="group__title" data-i18n="dividend.gHoldings">持有部位</h2>
        <span class="group__aside" id="posValue">-</span>
      </div>
      <div class="holding-head" aria-hidden="true">
        <span></span><span>Name</span><span>Value</span><span>Yield</span><span></span>
      </div>
      <div class="holdings" id="holdings"></div>
      <div class="btn-row" style="margin-top:var(--s3)">
        <button class="btn btn--quiet" id="btnAdd" type="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>
          Add holding
        </button>
      </div>
      <p class="field__hint" style="margin-top:var(--s3)">Pay months and frequency are set on each row below.</p>
      <div id="schedules" style="margin-top:var(--s3)"></div>
    </div>

    <div class="group">
      <div class="group__head"><h2 class="group__title" data-i18n="dividend.gOverTime">長期</h2></div>

      <div class="field">
        <label class="field__label" for="growth"><span data-i18n="dividend.growth">配息每年成長</span>
          <span class="field__hint" id="growthNote"></span></label>
        <div class="range-row">
          <input class="range" id="growth" type="range" min="0" max="15" step="0.1" value="5">
          <output class="range-val" for="growth" id="growthOut">5.0%</output>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="horizon"><span data-i18n="dividend.horizon">往後看幾年</span></label>
        <div class="range-row">
          <input class="range" id="horizon" type="range" min="5" max="40" step="1" value="20">
          <output class="range-val" for="horizon" id="horizonOut">20</output>
        </div>
      </div>

      <div class="switch-row">
        <label class="field__label" for="reinvest"><span data-i18n="dividend.reinvest">配息再投入</span></label>
        <button class="switch" id="reinvest" role="switch" aria-checked="true" aria-label="Reinvest dividends"></button>
      </div>

      <div class="field" style="margin-top:var(--s4)">
        <label class="field__label" for="addMonthly"><span data-i18n="dividend.addMonthly">另外每月再投入</span></label>
        <div class="input-wrap" data-num="addMonthly">
          <span class="input-wrap__prefix" data-cur-symbol>NT$</span>
          <input class="input" id="addMonthly" type="number" inputmode="numeric" value="0" min="0" step="5000">
          <span class="stepper">
            <button type="button" data-dir="1" aria-label="Increase monthly addition"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6.5 5 3.5l3 3"/></svg></button>
            <button type="button" data-dir="-1" aria-label="Decrease monthly addition"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.5 5 6.5l3-3"/></svg></button>
          </span>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group__head"><h2 class="group__title" data-i18n="dividend.gReality">現實面</h2></div>

      <div class="field">
        <label class="field__label" for="tax"><span data-i18n="dividend.tax">股利扣繳稅率</span></label>
        <div class="range-row">
          <input class="range" id="tax" type="range" min="0" max="45" step="1" value="20">
          <output class="range-val" for="tax" id="taxOut">20%</output>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="spend"><span data-i18n="dividend.spend">每月要蓋掉的生活費</span></label>
        <div class="input-wrap" data-num="spend">
          <span class="input-wrap__prefix" data-cur-symbol>NT$</span>
          <input class="input" id="spend" type="number" inputmode="numeric" value="60000" min="0" step="5000">
          <span class="stepper">
            <button type="button" data-dir="1" aria-label="Increase spending"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6.5 5 3.5l3 3"/></svg></button>
            <button type="button" data-dir="-1" aria-label="Decrease spending"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.5 5 6.5l3-3"/></svg></button>
          </span>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group__head"><h2 class="group__title" data-i18n="common.currency">幣別</h2></div>
      <div class="seg" id="curSeg" role="group" data-i18n-attr="aria-label:common.currency">
        <button type="button" data-cur="TWD" aria-pressed="true">TWD</button>
        <button type="button" data-cur="USD" aria-pressed="false">USD</button>
        <button type="button" data-cur="EUR" aria-pressed="false">EUR</button>
        <button type="button" data-cur="HKD" aria-pressed="false">HKD</button>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn--ghost" id="btnShare" type="button"><span data-i18n="common.copyLink">複製連結</span></button>
      <button class="btn btn--quiet" id="btnReset" type="button" data-i18n="common.reset">重設</button>
    </div>
  </aside>

  <main class="stage" id="stage">

    <div class="stage__head">
      <div>
        <h1 class="stage__title" data-i18n="dividend.h1">配息</h1>
        <p class="stage__sub" data-i18n="dividend.sub">年化殖利率完全沒告訴你帳單到期那個月有沒有錢。這是扣完稅的月曆。</p>
      </div>
    </div>

    <div class="metrics" id="metrics">
      <div class="metric" id="mYear">
        <div class="metric__label" data-i18n="dividend.mYear">今年配息，稅後</div>
        <div class="metric__value metric__value--accent num" id="vYear">-</div>
        <div class="metric__foot" id="fYear">&nbsp;</div>
      </div>
      <div class="metric" id="mMonth">
        <div class="metric__label" data-i18n="dividend.mMonth">最多的月份對上最少的</div>
        <div class="metric__value num" id="vMonth">-</div>
        <div class="metric__foot" id="fMonth">&nbsp;</div>
      </div>
      <div class="metric" id="mCover">
        <div class="metric__label" data-i18n="dividend.mCover">蓋過生活費還要</div>
        <div class="metric__value num" id="vCover">-</div>
        <div class="metric__foot" id="fCover">&nbsp;</div>
      </div>
      <div class="metric" id="mYoc">
        <div class="metric__label" data-i18n="dividend.mYoc">以今天成本計的殖利率</div>
        <div class="metric__value metric__value--pos num" id="vYoc">-</div>
        <div class="metric__foot" id="fYoc">&nbsp;</div>
      </div>
    </div>

    <section class="panel" style="margin-top:var(--s5)" aria-labelledby="calTitle">
      <div class="panel__head">
        <h2 class="panel__title" id="calTitle" data-i18n="dividend.calTitle">今年，逐月</h2>
        <span class="group__aside" id="calNote">after tax</span>
      </div>
      <div class="panel__body panel__body--flush">
        <div class="cal" id="cal"></div>
      </div>
    </section>

    <section class="panel" style="margin-top:var(--s5)" data-reveal aria-labelledby="growTitle">
      <div class="panel__head">
        <h2 class="panel__title" id="growTitle" data-i18n="dividend.growTitle">配息收入對上生活費</h2>
        <div class="legend" id="legend"></div>
      </div>
      <div class="panel__body">
        <div class="chart" id="chart"></div>
      </div>
      <div class="readout" id="readout"></div>
    </section>

    <div class="split split--even" data-reveal>
      <section class="panel" aria-labelledby="riTitle">
        <div class="panel__head"><h2 class="panel__title" id="riTitle" data-i18n="dividend.riTitle">再投入，還是拿來花</h2></div>
        <div class="panel__body">
          <p class="fee-claim" id="riClaim">-</p>
          <p class="fee-sub" id="riSub">&nbsp;</p>
          <div class="fee-bars" id="riBars"></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="conTitle">
        <div class="panel__head">
          <h2 class="panel__title" id="conTitle" data-i18n="dividend.conTitle">集中度</h2>
          <span class="group__aside">where the income comes from</span>
        </div>
        <div class="panel__body">
          <div id="donut"></div>
          <div style="margin-top:var(--s5)" id="conList"></div>
        </div>
      </section>
    </div>

    <p class="disclosure" style="margin-top:var(--s5)" data-i18n="dividend.disclosure"></p>
  </main>

</div>
</div>

<footer class="site-foot"></footer>
<script type="module" src="./app.js"></script>
</body>
</html>
